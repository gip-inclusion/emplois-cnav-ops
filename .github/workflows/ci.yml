name: CI

on:
  # ArgoCD auto-syncs the tracked branch: a broken merge would be deployed, so we also check before merging
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions: {}

jobs:
  sops:
    name: Check SOPS files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-sops-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Check they are encrypted, for the recipients of .sops.yaml
        run: uv run --locked .github/scripts/check_sops_files.py
