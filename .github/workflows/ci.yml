name: CI

on:
  # ArgoCD auto-syncs the tracked branch: a broken merge would be deployed, so we also check before merging
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions: {}

jobs:
  pre-commit:
    name: Run the pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-pre-commit-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # Needed by the render-charts hook
      - name: Build the chart dependencies
        run: |
          set -euo pipefail
          helm version
          for chart in charts/*/; do
            # helm dependency build requires the chart repositories to be registered
            for repository in $(yq '(.dependencies // [])[].repository' "${chart}Chart.yaml" | sort -u); do
              helm repo add "${repository//[^a-zA-Z0-9]/-}" "$repository" --force-update
            done
            helm dependency build "$chart"
          done
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the hooks on all the files
        env:
          # The gitleaks hook only scans the staged changes, and GitHub secret scanning covers the pushed commits
          SKIP: gitleaks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
