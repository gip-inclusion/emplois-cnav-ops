apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    address: http://authentik-server.{{ .Release.Namespace }}.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      # Custom per-user headers emitted via the IC mapping's additionalHeaders (first/last name).
      - X-authentik-given-name
      - X-authentik-family-name
