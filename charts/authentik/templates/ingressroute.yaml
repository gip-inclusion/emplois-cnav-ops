apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    # Default authentication flow (akadmin password login, PDI SSO users use another flow): admin IPs only
    # Both its page and the executor API that checks the password, otherwise the API could be called directly
    - match: >-
        Host(`auth.interops-a.inclusion.gouv.fr`) && (PathPrefix(`/if/flow/default-authentication-flow`)
        || PathPrefix(`/api/v3/flows/executor/default-authentication-flow`))
      kind: Rule
      middlewares:
        - name: authentik-admin-login-ipallowlist
      services:
        - name: authentik-server
          port: 80
    - match: Host(`auth.interops-a.inclusion.gouv.fr`)
      kind: Rule
      services:
        - name: authentik-server
          port: 80
  tls:
    certResolver: letsencrypt
