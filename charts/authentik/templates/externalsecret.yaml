apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: scaleway
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: id:{{ .Values.scaleway.secretId }}
        version: latest_enabled
        property: secret_key
    - secretKey: pdi_sso_client_id
      remoteRef:
        key: id:{{ .Values.scaleway.secretId }}
        version: latest_enabled
        property: pdi_sso_client_id
    - secretKey: pdi_sso_client_secret
      remoteRef:
        key: id:{{ .Values.scaleway.secretId }}
        version: latest_enabled
        property: pdi_sso_client_secret
    - secretKey: bootstrap_admin_password
      remoteRef:
        key: id:{{ .Values.scaleway.secretId }}
        version: latest_enabled
        property: bootstrap_admin_password
    - secretKey: bootstrap_admin_email
      remoteRef:
        key: id:{{ .Values.scaleway.secretId }}
        version: latest_enabled
        property: bootstrap_admin_email
---
# Connection to the shared managed RDB (emplois-cnav-postgresql) for authentik:
# - host/port/name from authentik-database-connection (set in emplois-cnav/database)
# - user/password from authentik-database (set in emplois-cnav/secret-manager)
# Single target Secret consumed by the AUTHENTIK_POSTGRESQL__* env (see values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-database
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: scaleway
    kind: ClusterSecretStore
  target:
    name: authentik-database
    creationPolicy: Owner
  data:
    {{- range $property := list "host" "port" "name" }}
    - secretKey: {{ $property }}
      remoteRef:
        key: name:authentik-database-connection
        version: latest_enabled
        property: {{ $property }}
    {{- end }}
    {{- range $property := list "user" "password" }}
    - secretKey: {{ $property }}
      remoteRef:
        key: name:authentik-database
        version: latest_enabled
        property: {{ $property }}
    {{- end }}
