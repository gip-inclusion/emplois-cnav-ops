{{- if .Values.secretStore.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStore.name }}
spec:
  provider:
    scaleway:
      region: {{ .Values.scaleway.region }}
      projectId: {{ .Values.scaleway.projectId | quote }}
      accessKey:
        secretRef:
          name: {{ .Values.secretStore.credentialsSecretName }}
          namespace: {{ .Values.secretStore.credentialsNamespace }}
          key: access-key
      secretKey:
        secretRef:
          name: {{ .Values.secretStore.credentialsSecretName }}
          namespace: {{ .Values.secretStore.credentialsNamespace }}
          key: secret-key
{{- end }}
