# Traefik wrapper chart values

traefik:
  deployment:
    replicas: 1
    initContainers:
      - name: volume-permissions
        image: busybox:latest
        command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json && chown 65532:65532 /data/acme.json"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
        volumeMounts:
          - name: data
            mountPath: /data

  # acme.json lives on a ReadWriteOnce volume: stop the old pod before starting the new one, otherwise a new pod
  # scheduled on another node can't attach the volume and the rollout hangs
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  service:
    spec:
      type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/scw-loadbalancer-forward-port-algorithm: roundrobin
      service.beta.kubernetes.io/scw-loadbalancer-id: "fr-par-1/06893cb9-d7bc-4b9b-b477-b037d2ae45b0"
      # Wrap backend connections in PROXY protocol v2 so Traefik gets the real client IP (needed by the
      # API ipAllowList). The entrypoints below MUST trust it (proxyProtocol.trustedIPs) or all traffic breaks.
      service.beta.kubernetes.io/scw-loadbalancer-proxy-protocol-v2: "*"

  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true

  ingressClass:
    enabled: true
    isDefaultClass: true

  ports:
    web:
      # Trust the PROXY protocol header from the LB (Kubernetes Private Network)
      proxyProtocol:
        trustedIPs:
          - 10.252.0.0/20
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
    websecure:
      proxyProtocol:
        trustedIPs:
          - 10.252.0.0/20
      # No upstream HTTP proxy: the default LB backends has forward_protocol=tcp by default.
      # https://www.scaleway.com/en/developers/api/load-balancer/zoned/~schemas#scaleway-lb-v1-protocol
      # So trust no X-Forwarded-* sent to this entrypoint: Traefik strips them and sets its own.
      # Don't include the LB CIDR either: with PROXY protocol, the source address is already the client's one.
      forwardedHeaders:
        trustedIPs: []
      http:
        # Drop the headers whose name aliases another one (ex: X_authentik_uid): uwsgi read it as X-authentik-uid,
        # while the forward-auth only replaces the canonical form.
        # Strongly recommended when an entry point fronts a backend normalizing the header names.
        # https://doc.traefik.io/traefik/security/header-aliases/
        aliasHeadersStrategy: delete
        tls:
          enabled: true

  certificatesResolvers:
    letsencrypt:
      acme:
        email: tech@inclusion.gouv.fr
        storage: /data/acme.json
        tlsChallenge: true

  # Use JSON logging for faceted search in Grafana Logs Drilldown
  log:
    format: json
  accessLog:
    enabled: true
    format: json
    fields:
      # Headers are dropped by default: keep it that way (Authorization, Cookie)
      queryParameters:
        # Drop the querystring from RequestPath (the redirections of Authentik and ArgoCD may have sensitive values)
        defaultMode: drop

  persistence:
    enabled: true
    size: 1Gi
    storageClass: scw-bssd
