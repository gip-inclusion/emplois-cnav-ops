apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cockpit.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: scaleway
    kind: ClusterSecretStore
  target:
    name: {{ .Values.cockpit.secretName }}
    creationPolicy: Owner
  data:
    # Cockpit authenticates the pushed logs with the token passed as Loki tenant ID (X-Scope-OrgID)
    - secretKey: tenantId
      remoteRef:
        key: id:{{ .Values.cockpit.secretId }}
        version: latest_enabled
        property: token
