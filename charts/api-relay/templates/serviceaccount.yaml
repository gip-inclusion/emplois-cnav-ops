{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-relay.serviceAccountName" . }}
  labels:
    {{- include "api-relay.labels" . | nindent 4 }}
  annotations:
    # ArgoCD: before the migrations job (wave 0), which runs under it
    argocd.argoproj.io/sync-wave: "-1"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
