# AGE private key of the cluster, used by helm-secrets on the repo-server to decrypt the SOPS values files

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: helm-secrets-private-keys
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: scaleway
    kind: ClusterSecretStore
  target:
    name: helm-secrets-private-keys
    creationPolicy: Owner
  data:
    # File read by sops through SOPS_AGE_KEY_FILE
    - secretKey: key.txt
      remoteRef:
        key: name:{{ .Values.sopsAgeKey.remoteSecretName }}
        version: latest_enabled
        property: {{ .Values.sopsAgeKey.remoteProperty }}
